; Merge these sections into your project's Config/DefaultEngine.ini (see repo README).

[/Script/Engine.PhysicsSettings]
; ABP_MasterCharacter footsteps switch on these surface types (order matters: SurfaceType1..3).
+PhysicalSurfaces=(Type=SurfaceType1,Name="Grass")
+PhysicalSurfaces=(Type=SurfaceType2,Name="Metal")
+PhysicalSurfaces=(Type=SurfaceType3,Name="Wood")

[/Script/Engine.Engine]
; First-person camera sits inside the head; the default 10cm near plane clips the arms/weapons.
NearClipPlane=1.000000
